name: FanchmWrt RE-SP-01B

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 配置档位
        required: true
        default: minimal
        type: choice
        options: [minimal, full]
      mirror:
        description: feeds 走 GitHub 镜像（国内更快）
        required: true
        default: true
        type: boolean
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 检出构建工程
        uses: actions/checkout@v4

      - name: 释放磁盘空间（runner 默认只剩约 20G，不够编 OpenWrt）
        run: |
          df -h / || true
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost /usr/lib/jvm /usr/share/swift || true
          sudo apt-get clean || true
          df -h / || true

      - name: 缓存下载目录
        uses: actions/cache@v4
        with:
          path: fanchmwrt-dl
          key: dl-${{ runner.os }}-${{ hashFiles('config/*.seed') }}
          restore-keys: dl-${{ runner.os }}-

      - name: 编译（调用 scripts/build.sh）
        env:
          PROFILE: ${{ inputs.profile || 'minimal' }}
          USE_MIRROR: ${{ (inputs.mirror == false && '0') || '1' }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: 收集固件
        run: |
          mkdir -p dist
          cp out/*.bin out/*.itb dist/ 2>/dev/null || true
          cp -r out/fanchmwrt-apks dist/ 2>/dev/null || true
          ls -lh dist

      - name: 打包 APK 组件
        run: |
          if [[ -d dist/fanchmwrt-apks ]]; then
            cd dist && zip -qry fanchmwrt-apks.zip fanchmwrt-apks && rm -rf fanchmwrt-apks
            ls -lh
          fi

      - name: 上传 Artifact（固件）
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-re-sp-01b-${{ inputs.profile || 'minimal' }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传构建日志（便于定位是哪个包出错）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-full.log
            fanchmwrt/logs/
            fanchmwrt/.config
            fanchmwrt/feeds.conf.default
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 检出（读取版本/元信息）
        uses: actions/checkout@v4

      - name: 下载固件 Artifact
        uses: actions/download-artifact@v4
        with:
          name: fanchmwrt-re-sp-01b-${{ inputs.profile || 'minimal' }}
          path: dist

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只收集真实存在的产物：glob 匹配不到时展开为空，避免把字面量
          # "dist/*.zip" 传给 gh 导致 "file not found" 报错（上一版就死在这）
          shopt -s nullglob
          files=( dist/*.bin dist/*.itb dist/*.zip )
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有任何可发布的固件产物"; exit 1
          fi
          echo "将发布以下文件："
          printf '  %s\n' "${files[@]}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # 滚动发布：先删旧的 autobuild（连 tag 一起），再以当前 commit 重建
            gh release delete autobuild --yes --cleanup-tag 2>/dev/null || true
            gh release create autobuild "${files[@]}" \
              --prerelease \
              --title "自动构建（最新 main 分支）" \
              --notes "由 CI 在每次 main 分支构建成功后自动更新。来源 commit: ${GITHUB_SHA:0:7}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            gh release create "$tag" "${files[@]}" \
              --generate-notes \
              --title "FanchmWrt RE-SP-01B $tag" \
              --notes "刷机包与配套 APK 组件。刷机步骤见仓库 README.md。"
          fi
